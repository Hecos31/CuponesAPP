services:
  - type: web
    name: zelloapp-backend
    runtime: python
    rootDir: Back
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite:///./zelloapp.db
      - key: SECRET_KEY
        generateValue: true
